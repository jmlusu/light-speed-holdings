{% extends "base.html" %}
{% block title %}Escalations & Approvals — CEO Dashboard{% endblock %}

{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
  <!-- ═══ PENDING APPROVALS ═══ -->
  <div>
    <div class="flex items-center justify-between mb-4">
      <div>
        <h2 class="text-xl font-semibold font-display text-jarvis-text">Pending Approvals</h2>
        <p class="text-sm text-jarvis-muted mt-1" x-text="approvals.length + ' awaiting decision'"></p>
      </div>
      <button @click="loadApprovals()" class="text-jarvis-muted hover:text-jarvis-text transition-colors p-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      </button>
    </div>

    <div x-show="approvals.length === 0" class="jarvis-glass rounded-xl p-8 text-center">
      <div class="w-12 h-12 rounded-full bg-emerald-500/10 flex items-center justify-center mx-auto mb-3">
        <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </div>
      <p class="text-sm text-jarvis-muted">All caught up! No pending approvals.</p>
    </div>

    <div class="space-y-3">
      <template x-for="req in approvals" :key="req.id">
        <div class="jarvis-glass rounded-xl p-5 hover:border-jarvis-cyan/20 transition-all">
          <div class="flex items-start justify-between mb-3">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-lg bg-purple-500/10 flex items-center justify-center">
                <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
              </div>
              <div>
                <h4 class="text-sm font-semibold text-jarvis-text" x-text="req.action"></h4>
                <p class="text-xs text-jarvis-muted font-mono">by <span class="font-mono" x-text="req.agent_id"></span></p>
              </div>
            </div>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-medium bg-purple-500/10 text-purple-400">pending</span>
          </div>
          <p class="text-sm text-jarvis-muted mb-4" x-text="req.description"></p>
          <!-- Risk level & cost estimate display -->
          <div class="flex flex-wrap gap-3 mb-4 text-xs">
            <span class="px-2 py-0.5 rounded-full font-medium"
                  :class="req.risk_level === 'high' ? 'bg-red-500/10 text-red-400' : req.risk_level === 'medium' ? 'bg-amber-500/10 text-amber-400' : 'bg-emerald-500/10 text-emerald-400'"
                  x-text="'Risk: ' + (req.risk_level || 'unset')"></span>
            <span class="px-2 py-0.5 rounded-full font-medium bg-jarvis-cyan/10 text-jarvis-cyan"
                  x-text="'Est. $' + (req.cost_estimate != null ? Number(req.cost_estimate).toFixed(4) : '—')"></span>
          </div>
          <!-- Inline edit form (F3) -->
          <div x-show="editingApproval === req.id" x-collapse class="mb-4">
            <div class="jarvis-glass rounded-lg p-4 border border-jarvis-cyan/20 space-y-3">
              <div class="flex items-center gap-3">
                <label class="text-xs text-jarvis-muted w-16 shrink-0">Risk</label>
                <select x-model="editRisk"
                        class="flex-1 bg-jarvis-base border border-white/[0.08] rounded-lg px-2 py-1 text-xs text-jarvis-text focus:border-jarvis-cyan focus:outline-none">
                  <option value="">unset</option>
                  <option value="low">low</option>
                  <option value="medium">medium</option>
                  <option value="high">high</option>
                </select>
              </div>
              <div class="flex items-center gap-3">
                <label class="text-xs text-jarvis-muted w-16 shrink-0">Cost</label>
                <input type="number" step="0.0001" min="0" x-model="editCost"
                       class="flex-1 bg-jarvis-base border border-white/[0.08] rounded-lg px-2 py-1 text-xs text-jarvis-text focus:border-jarvis-cyan focus:outline-none"
                       placeholder="0.0000">
              </div>
              <div class="flex justify-end gap-2">
                <button @click="editingApproval = null"
                        class="px-3 py-1 rounded-lg text-xs font-medium text-jarvis-muted hover:text-jarvis-text transition-colors">Cancel</button>
                <button @click="saveApprovalEdit(req.id)"
                        class="px-3 py-1 rounded-lg text-xs font-medium bg-jarvis-cyan text-white hover:bg-jarvis-cyan/80 transition-colors">Save</button>
              </div>
            </div>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-xs text-jarvis-muted font-mono" x-text="formatTime(req.requested_at)"></span>
            <div class="flex gap-2">
              <button @click="editingApproval = req.id; editRisk = req.risk_level || ''; editCost = req.cost_estimate ?? ''"
                      class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-jarvis-cyan/10 text-jarvis-cyan hover:bg-jarvis-cyan/20 transition-colors flex items-center gap-1"
                      title="Edit risk & cost">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                Edit
              </button>
              <button @click="approveRequest(req.id)"
                      class="px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-600 text-white hover:bg-emerald-500 transition-colors flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                Approve
              </button>
              <button @click="rejectRequest(req.id)"
                      class="px-3 py-1.5 rounded-lg text-xs font-medium bg-red-500/10 text-red-400 hover:bg-red-500/20 transition-colors flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                Reject
              </button>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- ═══ OPEN ESCALATIONS ═══ -->
  <div>
    <div class="flex items-center justify-between mb-4">
      <div>
        <h2 class="text-xl font-semibold font-display text-jarvis-text">Open Escalations</h2>
        <p class="text-sm text-jarvis-muted mt-1" x-text="escalations.length + ' require resolution'"></p>
      </div>
      <button @click="loadEscalations()" class="text-jarvis-muted hover:text-jarvis-text transition-colors p-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      </button>
    </div>

    <div x-show="escalations.length === 0" class="jarvis-glass rounded-xl p-8 text-center">
      <div class="w-12 h-12 rounded-full bg-emerald-500/10 flex items-center justify-center mx-auto mb-3">
        <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </div>
      <p class="text-sm text-jarvis-muted">All clear! No open escalations.</p>
    </div>

    <div class="space-y-3">
      <template x-for="evt in escalations" :key="evt.task_id">
        <div class="jarvis-glass rounded-xl border border-red-500/20 p-5 hover:border-red-500/30 transition-all">
          <div class="flex items-start justify-between mb-3">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-lg bg-red-500/10 flex items-center justify-center">
                <svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4.5c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
              </div>
              <div>
                <h4 class="text-sm font-semibold text-red-400" x-text="evt.rule_id"></h4>
                <p class="text-xs text-jarvis-muted font-mono">
                  <span class="font-mono" x-text="evt.from_agent"></span>
                  <svg class="w-3 h-3 inline mx-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                  <span class="font-mono" x-text="evt.to_agent"></span>
                </p>
              </div>
            </div>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-medium bg-red-500/10 text-red-400">escalated</span>
          </div>
          <p class="text-sm text-jarvis-muted mb-4" x-text="evt.reason"></p>
          <div class="flex items-center justify-between">
            <span class="text-xs text-jarvis-muted font-mono" x-text="formatTime(evt.timestamp)"></span>
            <button @click="resolveEscalation(evt.task_id)"
                    class="px-3 py-1.5 rounded-lg text-xs font-medium bg-jarvis-cyan text-white hover:bg-jarvis-cyan/80 transition-colors flex items-center gap-1.5">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
              Resolve
            </button>
          </div>
        </div>
      </template>
    </div>
  </div>
</div>
{% endblock %}
