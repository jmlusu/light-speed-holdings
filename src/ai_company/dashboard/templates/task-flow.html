{% extends "base.html" %}
{% block title %}Task Flow — CEO Dashboard{% endblock %}

{% block content %}
<div class="space-y-6">
  <div>
    <h2 class="text-xl font-semibold font-display text-jarvis-text">Task Flow</h2>
    <p class="text-sm text-jarvis-muted mt-1">Follow a single task's path through the system.</p>
  </div>

  <div class="jarvis-glass rounded-xl p-4">
    <div class="flex gap-2">
      <input x-model="flowTaskId" @keydown.enter="loadTaskFlow(flowTaskId)"
             placeholder="Enter task ID…"
             class="flex-1 bg-jarvis-base border border-white/[0.08] rounded-lg px-3 py-2 text-sm text-jarvis-text font-mono focus:border-jarvis-cyan focus:outline-none">
      <button @click="loadTaskFlow(flowTaskId)"
              class="px-4 py-2 rounded-lg text-sm font-medium bg-jarvis-cyan text-white hover:bg-jarvis-cyan/80 transition-colors">
        Trace
      </button>
    </div>
  </div>

  <div x-show="flowError" class="jarvis-glass rounded-xl p-5 border border-red-500/30">
    <p class="text-sm text-red-400" x-text="flowError"></p>
  </div>

  <div x-show="flow && flow.task" class="space-y-6">
    <!-- Task snapshot -->
    <div class="jarvis-glass rounded-xl p-5">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-semibold text-jarvis-text font-mono" x-text="flow.task.id"></h3>
        <span class="px-2 py-0.5 rounded-full text-[10px] font-medium bg-jarvis-cyan/10 text-jarvis-cyan"
              x-text="flow.current_status"></span>
      </div>
      <p class="text-sm text-jarvis-muted mt-2" x-text="flow.task.instruction"></p>
      <div class="mt-3 flex flex-wrap gap-2 text-xs text-jarvis-muted font-mono">
        <span x-show="flow.task.sender_id">from <span class="text-jarvis-text" x-text="flow.task.sender_id"></span></span>
        <span x-show="flow.task.receiver_id">→ to <span class="text-jarvis-text" x-text="flow.task.receiver_id"></span></span>
        <span x-show="flow.task.priority">· <span x-text="flow.task.priority"></span></span>
      </div>
    </div>

    <!-- Timeline -->
    <div class="jarvis-glass rounded-xl p-5">
      <h3 class="text-sm font-semibold text-jarvis-text mb-4">Lifecycle timeline</h3>
      <div x-show="!flow.timeline.length" class="text-sm text-jarvis-muted">
        No audit-trail events found for this task.
      </div>
      <div class="space-y-0">
        <template x-for="(ev, idx) in flow.timeline" :key="idx">
          <div class="relative flex gap-4 pb-5">
            <div class="flex flex-col items-center">
              <div class="w-3 h-3 rounded-full bg-jarvis-cyan mt-1 shrink-0"></div>
              <div x-show="idx < flow.timeline.length - 1" class="w-px flex-1 bg-white/[0.08]"></div>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between">
                <span class="text-xs font-semibold text-jarvis-text" x-text="ev.type"></span>
                <span class="text-xs text-jarvis-muted font-mono" x-text="formatTime(ev.timestamp)"></span>
              </div>
              <p x-show="ev.agent" class="text-xs text-jarvis-cyan font-mono mt-0.5" x-text="ev.agent"></p>
              <p x-show="ev.summary" class="text-xs text-jarvis-muted mt-1 line-clamp-2" x-text="ev.summary"></p>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
</div>
{% endblock %}
