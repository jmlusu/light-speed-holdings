<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200" role="img" aria-labelledby="title desc">
  <title id="title">H-A-O-M-T-G-V Framework (Full Vertical)</title>
  <desc id="desc">Complete H-A-O-M-T-G-V flow with feedback loops between Memory, Tools, Orchestration, Governance. Human at top, Value at bottom.</desc>

  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#070A40"/>
      <stop offset="100%" style="stop-color:#0A0C12"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00BFFF"/>
      <stop offset="100%" style="stop-color:#22D3EE"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E63946"/>
      <stop offset="100%" style="stop-color:#FF2D55"/>
    </linearGradient>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowRed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="url(#cyanGrad)"/>
    </marker>
    <marker id="arrowheadRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="url(#redGrad)"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#navyGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.5"/>
    </pattern>
    <rect width="800" height="1200" fill="url(#grid)"/>
  </g>

  <!-- Layer definitions -->
  <g font-family="Arial, sans-serif">
    <!-- HUMAN (top, accent red) -->
    <g transform="translate(400, 80)">
      <!-- Container -->
      <rect x="-180" y="-50" width="360" height="100" rx="16" fill="#0A0C12" stroke="url(#redGrad)" stroke-width="2" filter="url(#glowRed)"/>
      <!-- Badge -->
      <circle cx="-140" cy="0" r="24" fill="#0A0C12" stroke="url(#redGrad)" stroke-width="2"/>
      <text x="-140" y="8" text-anchor="middle" font-size="28" font-weight="900" fill="url(#redGrad)">H</text>
      <!-- Title -->
      <text x="0" y="-12" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">Human</text>
      <!-- Description -->
      <text x="0" y="18" text-anchor="middle" font-size="13" fill="#9CA3AF" style="max-width:300px">People set intent, own outcomes, hold final decision authority</text>
      <!-- Icon -->
      <g transform="translate(130, -10)" aria-hidden="true">
        <circle cx="0" cy="0" r="18" fill="none" stroke="url(#redGrad)" stroke-width="1.5"/>
        <path d="M0 -8 L0 8 M-6 4 L0 8 L6 4" stroke="url(#redGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="0" cy="-8" r="4" fill="url(#redGrad)"/>
      </g>
    </g>

    <!-- Connector H -> A -->
    <path d="M400 180 L400 230" stroke="url(#cyanGrad)" stroke-width="3" fill="none" marker-end="url(#arrowhead)" filter="url(#glowCyan)"/>

    <!-- AGENTS -->
    <g transform="translate(400, 280)">
      <rect x="-180" y="-50" width="360" height="100" rx="16" fill="#0A0C12" stroke="url(#cyanGrad)" stroke-width="2" filter="url(#glowCyan)"/>
      <circle cx="-140" cy="0" r="24" fill="#0A0C12" stroke="url(#cyanGrad)" stroke-width="2"/>
      <text x="-140" y="8" text-anchor="middle" font-size="28" font-weight="900" fill="url(#cyanGrad)">A</text>
      <text x="0" y="-12" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">Agents</text>
      <text x="0" y="18" text-anchor="middle" font-size="13" fill="#9CA3AF">89 specialized AI roles with explicit scopes & approval thresholds</text>
      <g transform="translate(130, -10)" aria-hidden="true">
        <circle cx="0" cy="0" r="18" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5"/>
        <circle cx="-6" cy="-3" r="5" fill="url(#cyanGrad)" opacity="0.7"/>
        <circle cx="6" cy="-3" r="5" fill="url(#cyanGrad)" opacity="0.7"/>
        <circle cx="0" cy="5" r="5" fill="url(#cyanGrad)" opacity="0.7"/>
        <path d="M-6 -3 L0 5 L6 -3" stroke="url(#cyanGrad)" stroke-width="1.5" fill="none"/>
      </g>
    </g>

    <!-- Connector A -> O -->
    <path d="M400 380 L400 430" stroke="url(#cyanGrad)" stroke-width="3" fill="none" marker-end="url(#arrowhead)" filter="url(#glowCyan)"/>

    <!-- ORCHESTRATION -->
    <g transform="translate(400, 480)">
      <rect x="-180" y="-50" width="360" height="100" rx="16" fill="#0A0C12" stroke="url(#cyanGrad)" stroke-width="2" filter="url(#glowCyan)"/>
      <circle cx="-140" cy="0" r="24" fill="#0A0C12" stroke="url(#cyanGrad)" stroke-width="2"/>
      <text x="-140" y="8" text-anchor="middle" font-size="28" font-weight="900" fill="url(#cyanGrad)">O</text>
      <text x="0" y="-12" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">Orchestration</text>
      <text x="0" y="18" text-anchor="middle" font-size="13" fill="#9CA3AF">Deterministic routing of tasks, data & decisions via MessageBus</text>
      <g transform="translate(130, -10)" aria-hidden="true">
        <circle cx="0" cy="0" r="18" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5"/>
        <path d="M-10 0 L10 0 M0 -10 L0 10" stroke="url(#cyanGrad)" stroke-width="2"/>
        <circle cx="-10" cy="0" r="3" fill="url(#cyanGrad)"/>
        <circle cx="10" cy="0" r="3" fill="url(#cyanGrad)"/>
        <circle cx="0" cy="-10" r="3" fill="url(#cyanGrad)"/>
        <circle cx="0" cy="10" r="3" fill="url(#cyanGrad)"/>
      </g>
    </g>

    <!-- Feedback loop indicators (left side) -->
    <g opacity="0.6">
      <!-- Memory -> Orchestration feedback -->
      <path d="M200 630 Q120 580 120 480" stroke="url(#cyanGrad)" stroke-width="2" fill="none" stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
      <text x="100" y="540" text-anchor="middle" font-size="11" fill="#00BFFF" transform="rotate(-30 100 540)">feedback</text>

      <!-- Tools -> Orchestration feedback -->
      <path d="M200 780 Q120 730 120 630" stroke="url(#cyanGrad)" stroke-width="2" fill="none" stroke-dasharray="8,4" marker-end="url(#arrowhead)"/>
      <text x="100" y="690" text-anchor="middle" font-size="11" fill="#00BFFF" transform="rotate(-30 100 690)">feedback</text>

      <!-- Governance -> Orchestration feedback -->
      <path d="M200 930 Q120 880 120 780" stroke="url(#redGrad)" stroke-width="2" fill="none" stroke-dasharray="8,4" marker-end="url(#arrowheadRed)"/>
      <text x="100" y="840" text-anchor="middle" font-size="11" fill="#E63946" transform="rotate(-30 100 840)">oversight</text>
    </g>

    <!-- Connector O -> M -->
    <path d="M400 580 L400 630" stroke="url(#cyanGrad)" stroke-width="3" fill="none" marker-end="url(#arrowhead)" filter="url(#glowCyan)"/>

    <!-- MEMORY -->
    <g transform="translate(400, 680)">
      <rect x="-180" y="-50" width="360" height="100" rx="16" fill="#0A0C12" stroke="url(#cyanGrad)" stroke-width="2" filter="url(#glowCyan)"/>
      <circle cx="-140" cy="0" r="24" fill="#0A0C12" stroke="url(#cyanGrad)" stroke-width="2"/>
      <text x="-140" y="8" text-anchor="middle" font-size="28" font-weight="900" fill="url(#cyanGrad)">M</text>
      <text x="0" y="-12" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">Memory</text>
      <text x="0" y="18" text-anchor="middle" font-size="13" fill="#9CA3AF">6-type persistent store: Episodic, Semantic, Procedural, Relational, Temporal, Aggregate</text>
      <g transform="translate(130, -10)" aria-hidden="true">
        <circle cx="0" cy="0" r="18" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5"/>
        <rect x="-12" y="-16" width="8" height="32" rx="2" fill="url(#cyanGrad)" opacity="0.3"/>
        <rect x="-2" y="-16" width="8" height="32" rx="2" fill="url(#cyanGrad)" opacity="0.5"/>
        <rect x="8" y="-16" width="8" height="32" rx="2" fill="url(#cyanGrad)" opacity="0.7"/>
        <rect x="18" y="-16" width="8" height="32" rx="2" fill="url(#cyanGrad)" opacity="0.9"/>
        <rect x="28" y="-16" width="8" height="32" rx="2" fill="url(#cyanGrad)"/>
        <rect x="38" y="-16" width="8" height="32" rx="2" fill="url(#cyanGrad)" opacity="0.8"/>
      </g>
    </g>

    <!-- Connector M -> T -->
    <path d="M400 780 L400 830" stroke="url(#cyanGrad)" stroke-width="3" fill="none" marker-end="url(#arrowhead)" filter="url(#glowCyan)"/>

    <!-- TOOLS -->
    <g transform="translate(400, 880)">
      <rect x="-180" y="-50" width="360" height="100" rx="16" fill="#0A0C12" stroke="url(#cyanGrad)" stroke-width="2" filter="url(#glowCyan)"/>
      <circle cx="-140" cy="0" r="24" fill="#0A0C12" stroke="url(#cyanGrad)" stroke-width="2"/>
      <text x="-140" y="8" text-anchor="middle" font-size="28" font-weight="900" fill="url(#cyanGrad)">T</text>
      <text x="0" y="-12" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">Tools</text>
      <text x="0" y="18" text-anchor="middle" font-size="13" fill="#9CA3AF">Isolated execution environments for APIs, data & actions</text>
      <g transform="translate(130, -10)" aria-hidden="true">
        <circle cx="0" cy="0" r="18" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5"/>
        <rect x="-10" y="-8" width="20" height="16" rx="3" fill="none" stroke="url(#cyanGrad)" stroke-width="2"/>
        <path d="M-5 -4 L5 4 M-5 4 L5 -4" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round"/>
        <rect x="-10" y="10" width="20" height="2" fill="url(#cyanGrad)" opacity="0.5"/>
        <rect x="-10" y="14" width="12" height="2" fill="url(#cyanGrad)" opacity="0.3"/>
      </g>
    </g>

    <!-- Connector T -> G -->
    <path d="M400 980 L400 1030" stroke="url(#cyanGrad)" stroke-width="3" fill="none" marker-end="url(#arrowheadRed)" filter="url(#glowCyan)"/>

    <!-- GOVERNANCE (red accent) -->
    <g transform="translate(400, 1080)">
      <rect x="-180" y="-50" width="360" height="100" rx="16" fill="#0A0C12" stroke="url(#redGrad)" stroke-width="3" filter="url(#glowRed)"/>
      <circle cx="-140" cy="0" r="24" fill="#0A0C12" stroke="url(#redGrad)" stroke-width="3"/>
      <text x="-140" y="8" text-anchor="middle" font-size="28" font-weight="900" fill="url(#redGrad)">G</text>
      <text x="0" y="-12" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">Governance</text>
      <text x="0" y="18" text-anchor="middle" font-size="13" fill="#9CA3AF">5-tier human approval, append-only audit receipts, risk-classified actions</text>
      <g transform="translate(130, -10)" aria-hidden="true">
        <circle cx="0" cy="0" r="18" fill="none" stroke="url(#redGrad)" stroke-width="2"/>
        <path d="M-8 0 L0 -8 L8 0 L0 4 Z" fill="none" stroke="url(#redGrad)" stroke-width="2.5"/>
        <path d="M-3 -2 L0 2 L3 -2" stroke="url(#redGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Connector G -> V -->
    <path d="M400 1180 L400 1230" stroke="url(#redGrad)" stroke-width="3" fill="none" marker-end="url(#arrowheadRed)" filter="url(#glowRed)"/>

    <!-- VALUE -->
    <g transform="translate(400, 1280)">
      <rect x="-180" y="-50" width="360" height="100" rx="16" fill="#0A0C12" stroke="url(#cyanGrad)" stroke-width="2" filter="url(#glowCyan)"/>
      <circle cx="-140" cy="0" r="24" fill="#0A0C12" stroke="url(#cyanGrad)" stroke-width="2"/>
      <text x="-140" y="8" text-anchor="middle" font-size="28" font-weight="900" fill="url(#cyanGrad)">V</text>
      <text x="0" y="-12" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">Value</text>
      <text x="0" y="18" text-anchor="middle" font-size="13" fill="#9CA3AF">Measured business outcomes: cost, latency, quality, adoption</text>
      <g transform="translate(130, -10)" aria-hidden="true">
        <circle cx="0" cy="0" r="18" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5"/>
        <path d="M-10 10 L-2 0 L2 4 L10 -6" stroke="url(#cyanGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="-10" cy="10" r="2.5" fill="url(#cyanGrad)"/>
        <circle cx="-2" cy="0" r="2.5" fill="url(#cyanGrad)"/>
        <circle cx="2" cy="4" r="2.5" fill="url(#cyanGrad)"/>
        <circle cx="10" cy="-6" r="2.5" fill="url(#cyanGrad)"/>
      </g>
    </g>
  </g>

  <!-- Brand bar at bottom -->
  <g transform="translate(0, 1180)">
    <rect x="50" y="0" width="233.33" height="4" fill="#070A40"/>
    <rect x="283.33" y="0" width="233.33" height="4" fill="#E63946"/>
    <rect x="516.66" y="0" width="233.34" height="4" fill="#00BFFF"/>
  </g>

  <!-- Attribution -->
  <text x="400" y="1195" text-anchor="middle" font-size="10" font-weight="700" fill="#E63946" letter-spacing="0.2em">LIGHTSPEED HOLDINGS DESIGN TEAM</text>
</svg>
