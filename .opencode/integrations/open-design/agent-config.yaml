# Open Design Integration - Agent Configuration
# This file defines how agents interact with Open Design.
# Single source of truth for agents: company-registry.yaml.
# The `skills` below mirror the `skills:` blocks in that registry. Regenerate
# them from the registry; do not edit by hand.

integrations:
  open-design:
    enabled: true
    version: "0.9.0"

    # Connection settings
    connection:
      method: cli  # cli or desktop
      # Canonical CLI name. In this source checkout `od` is not on PATH; invoke
      # it as: node open-design/apps/daemon/dist/cli.js
      cliPath: "od"
      autoUpdate: true

    # Authentication (AMR - no API key needed)
    auth:
      method: amr
      signInOnce: true

    # Default model
    models:
      default: "claude-sonnet-4.5"

    # Brand enforcement
    brand:
      enforceBrand: true
      tokensPath: "brand/tokens/brand-tokens.json"
      guidelinesPath: "brand/guidelines/brand-guidelines.md"

    # Output settings
    output:
      baseDir: "output/design"
      formats:
        - html
        - svg
        - png
        - pdf
        - pptx

# Agent-specific Open Design configurations.
# 12 agents, mirroring company-registry.yaml. `skills` are the ls-od-* render
# skills each agent may invoke. The final QA gate (ls-artifact-qa) is run by the
# creative_director; there is no separate artifact-qa-reviewer agent.
agents:
  creative_director:
    role: orchestrator
    skills:
      - ls-od-runtime
      - ls-od-catalogue
      - ls-od-brand
      - ls-od-project
      - ls-od-prototype
      - ls-od-live-artifact
      - ls-od-deck
      - ls-od-image
      - ls-od-video

  cmo:
    role: executive
    skills:
      - ls-od-runtime
      - ls-od-catalogue
      - ls-od-deck

  marketing_owner:
    role: production
    skills:
      - ls-od-catalogue
      - ls-od-deck
      - ls-od-image

  social_media_manager:
    role: production
    skills:
      - ls-od-image
      - ls-od-deck

  technical_documentation_lead:
    role: production
    skills:
      - ls-od-live-artifact
      - ls-od-deck

  product_marketing_manager:
    role: production
    skills:
      - ls-od-deck
      - ls-od-image

  product_designer:
    role: production
    skills:
      - ls-od-brand
      - ls-od-prototype
      - ls-od-live-artifact

  lead_frontend:
    role: production
    skills:
      - ls-od-prototype
      - ls-od-live-artifact

  senior_frontend_engineer:
    role: production
    skills:
      - ls-od-prototype

  market_analyst:
    role: production
    skills:
      - ls-od-live-artifact
      - ls-od-deck

  content_creator:
    role: production
    skills:
      - ls-od-image
      - ls-od-video
      - ls-od-deck

  media_generation_owner:
    role: production
    skills:
      - ls-od-runtime
      - ls-od-image
      - ls-od-video

# Workflow definitions
workflows:
  creative-brief:
    description: "End-to-end creative production workflow"
    steps:
      - name: intake
        agent: creative_director
        action: "Load brand system and ask 5 intake questions"

      - name: route
        agent: creative_director
        action: "Route to appropriate production skill based on artifact type"

      - name: produce
        agent: "[production-agent]"
        action: "Create artifact using Open Design with brand constraints"

      - name: qa
        agent: creative_director
        action: "Run ls-artifact-qa (visual, brand, UX, accessibility, and content QA)"

      - name: deliver
        agent: creative_director
        action: "Deliver approved artifact to user"
