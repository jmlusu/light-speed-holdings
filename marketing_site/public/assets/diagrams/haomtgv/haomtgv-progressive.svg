<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" width="1200" height="1400" role="img" aria-labelledby="title desc">
  <title id="title">H-A-O-M-T-G-V Framework (Progressive Reveal)</title>
  <desc id="desc">Animated H-A-O-M-T-G-V framework with progressive scroll reveal - each layer reveals on scroll.</desc>

  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#070A40"/>
      <stop offset="100%" style="stop-color:#0A0C12"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00BFFF"/>
      <stop offset="100%" style="stop-color:#22D3EE"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E63946"/>
      <stop offset="100%" style="stop-color:#FF2D55"/>
    </linearGradient>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowRed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="revealGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="url(#cyanGrad)"/>
    </marker>
    <marker id="arrowheadRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="url(#redGrad)"/>
    </marker>

    <!-- Reveal animation keyframes (CSS-based, referenced by class) -->
    <style type="text/css"><![CDATA[
      .reveal-layer {
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .reveal-layer.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .reveal-connector {
        opacity: 0;
        stroke-dashoffset: 100;
        transition: opacity 0.6s ease-out 0.2s, stroke-dashoffset 0.8s ease-out 0.2s;
      }
      .reveal-connector.visible {
        opacity: 1;
        stroke-dashoffset: 0;
      }
      @keyframes pulseCyan {
        0%, 100% { filter: url(#glowCyan); opacity: 0.8; }
        50% { filter: url(#revealGlow); opacity: 1; }
      }
      @keyframes pulseRed {
        0%, 100% { filter: url(#glowRed); opacity: 0.8; }
        50% { filter: url(#revealGlow); opacity: 1; }
      }
      .pulse-cyan { animation: pulseCyan 3s ease-in-out infinite; }
      .pulse-red { animation: pulseRed 3s ease-in-out infinite; }
    ]]></style>
  </defs>

  <rect width="1200" height="1400" fill="url(#navyGrad)"/>

  <g font-family="Arial, sans-serif">
    <!-- HUMAN (Layer 1 - reveals first) -->
    <g class="reveal-layer" style="transition-delay: 0ms;" transform="translate(600, 120)">
      <rect x="-200" y="-60" width="400" height="120" rx="20" fill="#0A0C12" stroke="url(#redGrad)" stroke-width="3" filter="url(#glowRed)" class="pulse-red"/>
      <circle cx="-150" cy="0" r="30" fill="#0A0C12" stroke="url(#redGrad)" stroke-width="3"/>
      <text x="-150" y="10" text-anchor="middle" font-size="36" font-weight="900" fill="url(#redGrad)">H</text>
      <text x="0" y="-18" text-anchor="middle" font-size="32" font-weight="800" fill="#FFFFFF">Human</text>
      <text x="0" y="22" text-anchor="middle" font-size="16" fill="#9CA3AF" style="max-width:350px">People set intent, own outcomes, hold final decision authority</text>
      <g transform="translate(160, -15)" aria-hidden="true">
        <circle cx="0" cy="0" r="24" fill="none" stroke="url(#redGrad)" stroke-width="2"/>
        <path d="M0 -12 L0 12 M-8 6 L0 12 L8 6" stroke="url(#redGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="0" cy="-12" r="6" fill="url(#redGrad)"/>
      </g>
    </g>

    <!-- Connector 1 -->
    <path class="reveal-connector" style="transition-delay: 200ms;" d="M600 240 L600 290" stroke="url(#cyanGrad)" stroke-width="4" fill="none" marker-end="url(#arrowhead)" filter="url(#glowCyan)" stroke-dasharray="100" stroke-dashoffset="100"/>

    <!-- AGENTS (Layer 2) -->
    <g class="reveal-layer" style="transition-delay: 300ms;" transform="translate(600, 390)">
      <rect x="-200" y="-60" width="400" height="120" rx="20" fill="#0A0C12" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#glowCyan)" class="pulse-cyan"/>
      <circle cx="-150" cy="0" r="30" fill="#0A0C12" stroke="url(#cyanGrad)" stroke-width="3"/>
      <text x="-150" y="10" text-anchor="middle" font-size="36" font-weight="900" fill="url(#cyanGrad)">A</text>
      <text x="0" y="-18" text-anchor="middle" font-size="32" font-weight="800" fill="#FFFFFF">Agents</text>
      <text x="0" y="22" text-anchor="middle" font-size="16" fill="#9CA3AF" style="max-width:350px">89 specialized AI roles with explicit scopes & approval thresholds</text>
      <g transform="translate(160, -15)" aria-hidden="true">
        <circle cx="0" cy="0" r="24" fill="none" stroke="url(#cyanGrad)" stroke-width="2"/>
        <circle cx="-12" cy="-8" r="7" fill="url(#cyanGrad)" opacity="0.7"/>
        <circle cx="12" cy="-8" r="7" fill="url(#cyanGrad)" opacity="0.7"/>
        <circle cx="0" cy="10" r="7" fill="url(#cyanGrad)" opacity="0.7"/>
        <path d="M-12 -8 L0 10 L12 -8" stroke="url(#cyanGrad)" stroke-width="2" fill="none"/>
      </g>
    </g>

    <!-- Connector 2 -->
    <path class="reveal-connector" style="transition-delay: 500ms;" d="M600 510 L600 560" stroke="url(#cyanGrad)" stroke-width="4" fill="none" marker-end="url(#arrowhead)" filter="url(#glowCyan)" stroke-dasharray="100" stroke-dashoffset="100"/>

    <!-- ORCHESTRATION (Layer 3) -->
    <g class="reveal-layer" style="transition-delay: 600ms;" transform="translate(600, 660)">
      <rect x="-200" y="-60" width="400" height="120" rx="20" fill="#0A0C12" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#glowCyan)" class="pulse-cyan"/>
      <circle cx="-150" cy="0" r="30" fill="#0A0C12" stroke="url(#cyanGrad)" stroke-width="3"/>
      <text x="-150" y="10" text-anchor="middle" font-size="36" font-weight="900" fill="url(#cyanGrad)">O</text>
      <text x="0" y="-18" text-anchor="middle" font-size="32" font-weight="800" fill="#FFFFFF">Orchestration</text>
      <text x="0" y="22" text-anchor="middle" font-size="16" fill="#9CA3AF" style="max-width:350px">Deterministic routing of tasks, data & decisions via MessageBus</text>
      <g transform="translate(160, -15)" aria-hidden="true">
        <circle cx="0" cy="0" r="24" fill="none" stroke="url(#cyanGrad)" stroke-width="2"/>
        <path d="M-20 0 L20 0 M0 -20 L0 20" stroke="url(#cyanGrad)" stroke-width="3"/>
        <circle cx="-20" cy="0" r="4" fill="url(#cyanGrad)"/>
        <circle cx="20" cy="0" r="4" fill="url(#cyanGrad)"/>
        <circle cx="0" cy="-20" r="4" fill="url(#cyanGrad)"/>
        <circle cx="0" cy="20" r="4" fill="url(#cyanGrad)"/>
      </g>
    </g>

    <!-- Feedback loops (left side, subtle) -->
    <g opacity="0.4" font-size="12">
      <path d="M360 720 Q260 660 260 610" stroke="url(#cyanGrad)" stroke-width="2" fill="none" stroke-dasharray="10,5" marker-end="url(#arrowhead)"/>
      <text x="230" y="650" text-anchor="middle" fill="#00BFFF" transform="rotate(-35 230 650)">feedback</text>
      <path d="M360 870 Q260 810 260 760" stroke="url(#cyanGrad)" stroke-width="2" fill="none" stroke-dasharray="10,5" marker-end="url(#arrowhead)"/>
      <text x="230" y="800" text-anchor="middle" fill="#00BFFF" transform="rotate(-35 230 800)">feedback</text>
      <path d="M360 1020 Q260 960 260 910" stroke="url(#redGrad)" stroke-width="2" fill="none" stroke-dasharray="10,5" marker-end="url(#arrowheadRed)"/>
      <text x="230" y="950" text-anchor="middle" fill="#E63946" transform="rotate(-35 230 950)">oversight</text>
    </g>

    <!-- Connector 3 -->
    <path class="reveal-connector" style="transition-delay: 800ms;" d="M600 780 L600 830" stroke="url(#cyanGrad)" stroke-width="4" fill="none" marker-end="url(#arrowhead)" filter="url(#glowCyan)" stroke-dasharray="100" stroke-dashoffset="100"/>

    <!-- MEMORY (Layer 4) -->
    <g class="reveal-layer" style="transition-delay: 900ms;" transform="translate(600, 930)">
      <rect x="-200" y="-60" width="400" height="120" rx="20" fill="#0A0C12" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#glowCyan)" class="pulse-cyan"/>
      <circle cx="-150" cy="0" r="30" fill="#0A0C12" stroke="url(#cyanGrad)" stroke-width="3"/>
      <text x="-150" y="10" text-anchor="middle" font-size="36" font-weight="900" fill="url(#cyanGrad)">M</text>
      <text x="0" y="-18" text-anchor="middle" font-size="32" font-weight="800" fill="#FFFFFF">Memory</text>
      <text x="0" y="22" text-anchor="middle" font-size="16" fill="#9CA3AF" style="max-width:350px">6-type persistent store: Episodic, Semantic, Procedural, Relational, Temporal, Aggregate</text>
      <g transform="translate(160, -15)" aria-hidden="true">
        <circle cx="0" cy="0" r="24" fill="none" stroke="url(#cyanGrad)" stroke-width="2"/>
        <rect x="-18" y="-24" width="12" height="48" rx="3" fill="url(#cyanGrad)" opacity="0.3"/>
        <rect x="-4" y="-24" width="12" height="48" rx="3" fill="url(#cyanGrad)" opacity="0.5"/>
        <rect x="10" y="-24" width="12" height="48" rx="3" fill="url(#cyanGrad)" opacity="0.7"/>
        <rect x="24" y="-24" width="12" height="48" rx="3" fill="url(#cyanGrad)" opacity="0.9"/>
        <rect x="38" y="-24" width="12" height="48" rx="3" fill="url(#cyanGrad)"/>
        <rect x="52" y="-24" width="12" height="48" rx="3" fill="url(#cyanGrad)" opacity="0.8"/>
      </g>
    </g>

    <!-- Connector 4 -->
    <path class="reveal-connector" style="transition-delay: 1100ms;" d="M600 1050 L600 1100" stroke="url(#cyanGrad)" stroke-width="4" fill="none" marker-end="url(#arrowhead)" filter="url(#glowCyan)" stroke-dasharray="100" stroke-dashoffset="100"/>

    <!-- TOOLS (Layer 5) -->
    <g class="reveal-layer" style="transition-delay: 1200ms;" transform="translate(600, 1200)">
      <rect x="-200" y="-60" width="400" height="120" rx="20" fill="#0A0C12" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#glowCyan)" class="pulse-cyan"/>
      <circle cx="-150" cy="0" r="30" fill="#0A0C12" stroke="url(#cyanGrad)" stroke-width="3"/>
      <text x="-150" y="10" text-anchor="middle" font-size="36" font-weight="900" fill="url(#cyanGrad)">T</text>
      <text x="0" y="-18" text-anchor="middle" font-size="32" font-weight="800" fill="#FFFFFF">Tools</text>
      <text x="0" y="22" text-anchor="middle" font-size="16" fill="#9CA3AF" style="max-width:350px">Isolated execution environments for APIs, data & actions</text>
      <g transform="translate(160, -15)" aria-hidden="true">
        <circle cx="0" cy="0" r="24" fill="none" stroke="url(#cyanGrad)" stroke-width="2"/>
        <rect x="-16" y="-12" width="32" height="24" rx="4" fill="none" stroke="url(#cyanGrad)" stroke-width="3"/>
        <path d="M-8 -6 L8 6 M-8 6 L8 -6" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round"/>
        <rect x="-16" y="16" width="32" height="3" fill="url(#cyanGrad)" opacity="0.5"/>
        <rect x="-16" y="22" width="24" height="3" fill="url(#cyanGrad)" opacity="0.3"/>
      </g>
    </g>

    <!-- Connector 5 -->
    <path class="reveal-connector" style="transition-delay: 1400ms;" d="M600 1320 L600 1370" stroke="url(#redGrad)" stroke-width="4" fill="none" marker-end="url(#arrowheadRed)" filter="url(#glowRed)" stroke-dasharray="100" stroke-dashoffset="100"/>

    <!-- GOVERNANCE (Layer 6 - red) -->
    <g class="reveal-layer" style="transition-delay: 1500ms;" transform="translate(600, 1470)">
      <rect x="-200" y="-60" width="400" height="120" rx="20" fill="#0A0C12" stroke="url(#redGrad)" stroke-width="4" filter="url(#glowRed)" class="pulse-red"/>
      <circle cx="-150" cy="0" r="30" fill="#0A0C12" stroke="url(#redGrad)" stroke-width="4"/>
      <text x="-150" y="10" text-anchor="middle" font-size="36" font-weight="900" fill="url(#redGrad)">G</text>
      <text x="0" y="-18" text-anchor="middle" font-size="32" font-weight="800" fill="#FFFFFF">Governance</text>
      <text x="0" y="22" text-anchor="middle" font-size="16" fill="#9CA3AF" style="max-width:350px">5-tier human approval, append-only audit receipts, risk-classified actions</text>
      <g transform="translate(160, -15)" aria-hidden="true">
        <circle cx="0" cy="0" r="24" fill="none" stroke="url(#redGrad)" stroke-width="3"/>
        <path d="M-12 0 L0 -12 L12 0 L0 6 Z" fill="none" stroke="url(#redGrad)" stroke-width="3.5"/>
        <path d="M-5 -4 L0 4 L5 -4" stroke="url(#redGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Connector 6 -->
    <path class="reveal-connector" style="transition-delay: 1700ms;" d="M600 1590 L600 1640" stroke="url(#redGrad)" stroke-width="4" fill="none" marker-end="url(#arrowheadRed)" filter="url(#glowRed)" stroke-dasharray="100" stroke-dashoffset="100"/>

    <!-- VALUE (Layer 7) -->
    <g class="reveal-layer" style="transition-delay: 1800ms;" transform="translate(600, 1740)">
      <rect x="-200" y="-60" width="400" height="120" rx="20" fill="#0A0C12" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#glowCyan)" class="pulse-cyan"/>
      <circle cx="-150" cy="0" r="30" fill="#0A0C12" stroke="url(#cyanGrad)" stroke-width="3"/>
      <text x="-150" y="10" text-anchor="middle" font-size="36" font-weight="900" fill="url(#cyanGrad)">V</text>
      <text x="0" y="-18" text-anchor="middle" font-size="32" font-weight="800" fill="#FFFFFF">Value</text>
      <text x="0" y="22" text-anchor="middle" font-size="16" fill="#9CA3AF" style="max-width:350px">Measured business outcomes: cost, latency, quality, adoption</text>
      <g transform="translate(160, -15)" aria-hidden="true">
        <circle cx="0" cy="0" r="24" fill="none" stroke="url(#cyanGrad)" stroke-width="2"/>
        <path d="M-16 14 L-4 0 L4 8 L16 -10" stroke="url(#cyanGrad)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="-16" cy="14" r="3.5" fill="url(#cyanGrad)"/>
        <circle cx="-4" cy="0" r="3.5" fill="url(#cyanGrad)"/>
        <circle cx="4" cy="8" r="3.5" fill="url(#cyanGrad)"/>
        <circle cx="16" cy="-10" r="3.5" fill="url(#cyanGrad)"/>
      </g>
    </g>
  </g>

  <!-- Brand bar -->
  <g transform="translate(0, 1850)">
    <rect x="100" y="0" width="333.33" height="4" fill="#070A40"/>
    <rect x="433.33" y="0" width="333.33" height="4" fill="#E63946"/>
    <rect x="766.66" y="0" width="333.34" height="4" fill="#00BFFF"/>
  </g>

  <!-- Attribution -->
  <text x="600" y="1880" text-anchor="middle" font-size="12" font-weight="700" fill="#E63946" letter-spacing="0.2em">LIGHTSPEED HOLDINGS DESIGN TEAM</text>

  <!-- JavaScript for scroll-triggered reveal (inline for self-contained SVG) -->
  <script type="text/ecmascript"><![CDATA[
    (function() {
      const layers = document.querySelectorAll('.reveal-layer');
      const connectors = document.querySelectorAll('.reveal-connector');

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          }
        });
      }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

      layers.forEach(layer => observer.observe(layer));
      connectors.forEach(conn => observer.observe(conn));
    })();
  ]]></script>
</svg>
