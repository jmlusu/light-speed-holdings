# Model routing policy for Light Speed Holdings.
#
# Agents are routed to models via three layers:
#   1. Per-agent override  — agent-registry.json field "model" (highest priority)
#   2. Tier routing        — maps agent type + priority to a cost tier
#   3. Provider defaults   — each tier lists providers in fallback order
#
# Tiers:  fast, standard, premium
#   fast     — cheapest, lowest latency, limited reasoning
#   standard — balanced cost/capability
#   premium  — best reasoning, highest cost
#
# Primary providers: OpenCode (Big Pickle, standard/premium) + Gemini Flash
# (fast/cheap). Deepseek and Kimi are cheap but have no African payment or
# registration path, so they are excluded from the routing tiers; OpenAI and
# Anthropic remain available in the catalog as future options. Ollama runs
# locally and costs nothing. llama.cpp runs locally with optimized CPU inference.

# ─── Provider catalog ────────────────────────────────────────────────
# Each provider entry: id, backend, default_model, api_base.
# API keys are read from env vars: {ID}_API_KEY (e.g. OPENCODE_API_KEY)
#
# OAuth2 client-credentials auth (opt-in): add an `oauth2:` block. Secrets
# come from env vars via client_id_env / client_secret_env. Without the
# block the provider falls back to {ID}_API_KEY static bearer auth.
#
#   enterprise-llm:
#     backend: openai_compatible
#     default_model: enterprise-model
#     api_base: https://llm.example.com/v1
#     oauth2:
#       token_url: https://idp.example.com/oauth/token
#       client_id_env: ENTERPRISE_LLM_CLIENT_ID
#       client_secret_env: ENTERPRISE_LLM_CLIENT_SECRET
#       scope: "llm:inference"
#       cache_ttl_seconds: 300

providers:
  opencode:
    backend: openai_compatible
    default_model: big-pickle
    api_base: https://opencode.ai/zen/v1

  deepseek:
    backend: openai_compatible
    default_model: deepseek-chat
    api_base: https://api.deepseek.com/v1

  gemini:
    backend: openai_compatible
    default_model: gemini-3.5-flash
    api_base: https://generativelanguage.googleapis.com/v1beta/openai

  kimi:
    backend: openai_compatible
    default_model: kimi-k2
    api_base: https://api.moonshot.ai/v1

  ollama:
    backend: ollama
    default_model: llama3.1-8b-32k
    api_base: http://localhost:11434
    # Per-model configuration (Ollama manages downloads and storage)
    models:
      llama3.1-8b-32k:
        specialization: general
        context_window: 32768
      mistral-7b-32k:
        specialization: general_fast
        context_window: 32768
      qwen2.5-coder-7b-32k:
        specialization: coding
        context_window: 32768
      deepseek-r1-64k:
        specialization: reasoning
        context_window: 65536
      gemma4-12b-32k:
        specialization: general_quality
        context_window: 32768

  llamacpp:
    backend: llamacpp
    default_model: llama3.1-8b-32k
    # Local GGUF models directory (relative to project root)
    model_dir: "./models"
    # Server settings (llama-server)
    server:
      host: "127.0.0.1"
      api_key: "local"
      # Server port mapping per model
      ports:
        llama3.1-8b-32k: 8088
        qwen2.5-coder-7b-32k: 8089
        deepseek-r1-64k: 8090
        mistral-7b-32k: 8092
        gemma2-9b-q5: 8091
    # CPU-optimized defaults for AMD Ryzen 7 PRO 5850U (8C/16T, shared RAM)
    hardware:
      n_threads: 8           # Physical cores (not hyperthreads)
      n_threads_batch: 8
      n_batch: 512
      n_ctx: 32768
      n_gpu_layers: 0        # CPU only (integrated graphics, no VRAM)
      use_mlock: true        # Prevent swap to disk
      use_mmap: true         # Fast model loading via mmap
    # Inference defaults (overridable per-request)
    inference:
      temperature: 0.3
      top_p: 0.9
      top_k: 40
      repeat_penalty: 1.1
      n_predict: 4096
    # Per-model configuration
    models:
      llama3.1-8b-32k:
        path: "models/llama-3.1-8b-instruct-q4_K_M.gguf"
        quantization: "q4_K_M"
        specialization: general
        context_window: 32768
        hardware:
          n_threads: 8
          n_batch: 512
          n_ctx: 32768
      mistral-7b-32k:
        path: "models/mistral-7b-instruct-v0.3-q4_K_M.gguf"
        quantization: "q4_K_M"
        specialization: general_fast
        context_window: 32768
        hardware:
          n_threads: 8
          n_batch: 512
          n_ctx: 32768
      qwen2.5-coder-7b-32k:
        path: "models/qwen2.5-coder-7b-instruct-q4_K_M.gguf"
        quantization: "q4_K_M"
        specialization: coding
        context_window: 32768
        hardware:
          n_threads: 8
          n_batch: 512
          n_ctx: 32768
      deepseek-r1-64k:
        path: "models/deepseek-r1-distill-qwen-7b-q4_K_M.gguf"
        quantization: "q4_K_M"
        specialization: reasoning
        context_window: 8192
        hardware:
          n_threads: 8
          n_batch: 256
          n_ctx: 8192  # Training context is 8192
      gemma2-9b-q5:
        path: "models/gemma-2-9b-it-q5_K_M.gguf"
        quantization: "q5_K_M"
        specialization: general_quality
        context_window: 8192
        hardware:
          n_threads: 8
          n_batch: 256
          n_ctx: 8192

  omniroute:
    backend: openai_compatible
    default_model: auto
    api_base: http://localhost:20128/v1

  openai:
    backend: openai_compatible
    default_model: gpt-4o-mini
    api_base: https://api.openai.com/v1

  anthropic:
    backend: openai_compatible
    default_model: claude-sonnet-4-20250514
    api_base: https://api.anthropic.com

# ─── Tier definitions ────────────────────────────────────────────────
# Each tier lists providers in preferred → fallback order.
# The first provider that is reachable (has API key) wins.

tiers:
  fast:
    description: "Low-latency, low-cost. Good for read-only and simple tasks."
    providers:
      - provider: llamacpp
        model: mistral-7b-32k
      - provider: ollama
        model: mistral-7b-32k
      - provider: gemini
        model: gemini-3.5-flash
      - provider: omniroute
        model: auto

  standard:
    description: "Balanced capability for general tasks."
    providers:
      - provider: llamacpp
        model: llama3.1-8b-32k
      - provider: llamacpp
        model: gemma2-9b-q5
      - provider: opencode
        model: big-pickle
      - provider: ollama
        model: qwen2.5-coder-7b-32k
      - provider: ollama
        model: llama3.1-8b-32k
      - provider: ollama
        model: gemma4-12b-32k
      - provider: gemini
        model: gemini-3.5-flash
      - provider: omniroute
        model: auto

  premium:
    description: "Maximum reasoning capability. Use for critical decisions."
    providers:
      - provider: llamacpp
        model: deepseek-r1-64k
      - provider: opencode
        model: big-pickle
      - provider: ollama
        model: deepseek-r1-64k
      - provider: ollama
        model: gemma4-12b-32k
      - provider: gemini
        model: gemini-3.1-pro-preview
      - provider: omniroute
        model: auto

# ─── Routing rules ──────────────────────────────────────────────────
# Maps (agent_type, priority) -> tier.
# Priority: low, medium, high, critical.
# If no rule matches, falls back to "standard".

routing:
  # Board advisors — read-only, advisory, low complexity
  - agent_type: Board
    tier: fast

  # Executives — orchestration and delegation
  - agent_type: Executive
    priority: low
    tier: standard
  - agent_type: Executive
    priority: medium
    tier: standard
  - agent_type: Executive
    priority: high
    tier: premium
  - agent_type: Executive
    priority: critical
    tier: premium

  # Specialists — technical execution
  - agent_type: Specialist
    priority: low
    tier: standard
  - agent_type: Specialist
    priority: medium
    tier: standard
  - agent_type: Specialist
    priority: high
    tier: premium
  - agent_type: Specialist
    priority: critical
    tier: premium

  # Escalations always use premium
  - context: escalation
    tier: premium

  # Approvals always use premium
  - context: approval
    tier: premium

  # Domain-aware routing (detected from task prompt keywords)
  - context: domain_code_review
    tier: premium
  - context: domain_security
    tier: premium
  - context: domain_deployment
    tier: standard
  - context: domain_finance
    tier: standard
  - context: domain_legal
    tier: premium
  - context: domain_data_science
    tier: premium

# ─── Task-type routing (NEW) ──────────────────────────────────────
# Maps task type detected from prompt to optimal tier.
# Task types: read_only, single_file_edit, simple_command, boilerplate,
#             code_review, debugging, refactor, integration,
#             architecture, planning, security, performance, general

task_type_routing:
  read_only: fast
  single_file_edit: fast
  simple_command: fast
  boilerplate: fast
  code_review: standard
  debugging: standard
  refactor: standard
  integration: standard
  architecture: premium
  planning: premium
  security: premium
  performance: premium
  general: standard

# ─── Free tier (dynamic) ──────────────────────────────────────────
# The 'free' tier uses a dynamic catalog of Opencode free models.
# ModelRouter.fetch_free_model_catalog() fetches from Opencode Zen API
# and sorts by context window (largest first) for token-limit rotation.
# Static providers listed below are used when API is unavailable.

free_tier:
  description: "Zero-cost tier using dynamic Opencode free models + Ollama fallback"
  # No static providers — dynamic catalog is fetched at runtime
  # Fallback static models if API unavailable:
  static_fallback:
    - provider: opencode
      model: big-pickle
    - provider: opencode
      model: gpt-5-nano
    - provider: ollama
      model: llama3.1-8b-32k
    - provider: omniroute
      model: auto

# ─── Token-limit rotation ────────────────────────────────────────
# When a provider returns a token-limit error, rotate through free
# models by context window size (largest first).

token_limit_rotation:
  enabled: true
  max_rotations: 3  # Max rotations before giving up
  # Error patterns that indicate context window exceeded
  error_patterns:
    - "context length"
    - "max_tokens"
    - "token limit"
    - "too many tokens"
    - "exceeds maximum"
    - "context window"
    - "maximum context"
    - "input too long"
    - "prompt too long"
    - "message too long"

# ─── Budget degradation thresholds ────────────────────────────────
# When daily budget exceeds these thresholds, force cheaper tiers.

budget_degradation:
  enabled: true
  warning_threshold: 0.80    # 80% — Log warning, prefer cheaper tier
  pressure_threshold: 0.90   # 90% — Force fast tier for non-critical tasks
  critical_threshold: 0.95   # 95% — Force free tier for all non-critical
  hard_stop_threshold: 1.00  # 100% — Hard stop (executor auto-suspend)
