#
# Rules (T1 scoreboard-v1 decisions):
# - No phase advance without a recorded gate review (gate_reviewed_by + date).
# - Velocity clock: internal delay always counts; external customer waits pause
#   the clock ONLY when logged here with reason + from/to dates.
# - Missing thesis_approved/deploy (or either gate unreviewed) -> the collector
#   reports velocity as no_data, never 0d.
# - CFO figures: contracted ARR + verified cost-avoidance ONLY (ADR-020/033).
#   Absent/unratified figures -> capital efficiency reports no_data.
# - Baseline: first 30 days after instrumentation_start = measurement only.

