## Docker Compose — Staging Environment
##
## Usage:
##   docker compose -f docker-compose.staging.yml up -d
##
## Environment: shell env or .env file (API keys injected via ${VAR:-} substitution)
## Profile: staging (does not conflict with default docker-compose.yml)

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: ai-company-dashboard-staging
    ports:
      - "8421:8420"
    volumes:
      - ./.opencode:/app/.opencode
      - ./company:/app/company
      - ./logs:/app/logs
    environment:
      - AI_COMPANY_LOG_JSON=1
      - DASHBOARD_AUTH_MODE=${DASHBOARD_AUTH_MODE:-api_key}
      - DASHBOARD_CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - DASHBOARD_RATE_LIMIT=200
      - AI_COMPANY_ENV=staging
      - DASHBOARD_API_KEY=${DASHBOARD_API_KEY:-}
      - DASHBOARD_RUN_KEY=${DASHBOARD_RUN_KEY:-}
      - DASHBOARD_APPROVE_KEY=${DASHBOARD_APPROVE_KEY:-}
      - DASHBOARD_ADMIN_KEY=${DASHBOARD_ADMIN_KEY:-}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8420/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    profiles:
      - staging
    networks:
      - staging

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: ai-company-worker-staging
    command: ["python", "-m", "ai_company.cli.main", "orchestrator", "tick"]
    volumes:
      - ./.opencode:/app/.opencode
      - ./company:/app/company
      - ./logs:/app/logs
    environment:
      - AI_COMPANY_LOG_JSON=1
      - AI_COMPANY_ENV=staging
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    restart: unless-stopped
    profiles:
      - staging
    networks:
      - staging

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ai-company-prometheus-staging
    ports:
      - "9091:9090"
    volumes:
      - ./config/prometheus.staging.yml:/etc/prometheus/prometheus.yml:ro
    profiles:
      - staging
      - monitoring
    networks:
      - staging

networks:
  staging:
    driver: bridge
