providers:
  anthropic:
    api_base: https://api.anthropic.com
    backend: anthropic
    default_model: claude-sonnet-4-20250514
  ollama:
    api_base: http://localhost:11434
    backend: ollama
    default_model: llama3.1:8b
  openai:
    api_base: https://api.openai.com/v1
    backend: openai
    default_model: gpt-4o-mini
routing:
- agent_type: Board
  tier: fast
- agent_type: Executive
  priority: medium
  tier: standard
- agent_type: Executive
  priority: critical
  tier: premium
- agent_type: Specialist
  priority: low
  tier: standard
- agent_type: Specialist
  priority: medium
  tier: standard
- agent_type: Specialist
  priority: high
  tier: premium
- agent_type: Specialist
  priority: critical
  tier: premium
- context: escalation
  tier: premium
- context: approval
  tier: premium
tiers:
  fast:
    description: Cheap and fast
    providers:
    - model: llama3.1:8b
      provider: ollama
    - model: gpt-4o-mini
      provider: openai
  premium:
    description: Best reasoning
    providers:
    - model: claude-opus-4-20250514
      provider: anthropic
  standard:
    description: Balanced
    providers:
    - model: gpt-4o
      provider: openai
    - model: claude-sonnet-4-20250514
      provider: anthropic
