[project]
name = "ai-company"
version = "0.1.0"
description = "AI Company powered by OpenCode"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Jack Mlusu" }
]

license = { text = "Proprietary — All Rights Reserved. Apache 2.0 at v1.0." }

dependencies = [
    "jinja2",
    "click",
    "rich",
    "pyyaml",
    "pydantic>=2.8",
    "networkx",
    "typer",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    # Security
    "cryptography>=42.0",
    # ML dependencies
    "sentence-transformers>=3.0",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "scipy>=1.13",
    # System monitoring / analytics
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/light-speed-holdings/ai-company"
Repository = "https://github.com/light-speed-holdings/ai-company"
Issues = "https://github.com/light-speed-holdings/ai-company/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-benchmark",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "types-PyYAML",
    "bandit",
    "safety",
    "build",
    "aiosqlite>=0.19",
    "pre-commit",
    "python-pptx>=0.6.23",
]

e2e = [
    "playwright>=1.40",
    "pytest-playwright>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".pytest_tmp/",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "BLE",   # flake8-blind-except
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "S112",  # try-except-continue
]
ignore = [
    "E501",  # line too long (handled by ruff format)
]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp/pytest"
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = [
    "performance: marks tests as performance benchmarks (deselect with '-m \"not performance\"')",
    "e2e: marks end-to-end tests requiring a running dashboard (deselect with '-m \"not e2e\"')",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_company*"]

[project.scripts]
ai-company = "ai_company.cli.main:app"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "scripts/",
    "results/",
    "tests/",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # Skip assert warnings
