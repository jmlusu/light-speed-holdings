name: Monitoring & Alerts

on:
  # Check every hour for anomalies
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      check_type:
        description: "Type of check: all, health, cycles, metrics"
        type: choice
        options:
          - all
          - health
          - cycles
          - metrics
        default: all

concurrency:
  group: monitoring
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  # ── Dashboard health check ─────────────────────────────────────────
  health-check:
    name: Dashboard Health Check
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.check_type == 'all' || github.event.inputs.check_type == 'health' || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check workflow run health
        run: |
          echo "Checking recent CI run status..."

          # Get last 5 CI runs
          RUNS=$(gh run list --workflow=ci.yml --limit=5 --json conclusion,updatedAt,headBranch 2>/dev/null || true)
          RUNS=${RUNS:-[]}
          FAILED=$(echo "$RUNS" | python -c "
          import sys, json
          data = sys.stdin.read().strip()
          runs = json.loads(data) if data else []
          failed = [r for r in runs if r.get('conclusion') == 'failure']
          print(len(failed))
          ")

          if [ "$FAILED" -gt 2 ]; then
            echo "::error::More than 2 recent CI runs failed ($FAILED/5)"

            # Root cause fix: gh requires every referenced label to already exist,
            # and the 'monitoring' label is not present in this repo. Create it up
            # front (idempotent — gh label create fails harmlessly when the label
            # already exists), so the 'bug,monitoring' combination works on every
            # run. Chosen over dropping 'monitoring' so alert issues stay
            # distinguishable from regular bug reports.
            gh label create monitoring --color "5319e7" --description "CI health / monitoring alert issues" 2>/dev/null || true

            # This workflow runs hourly — guard against duplicate issue spam by
            # skipping creation when an open CI-health alert issue already exists.
            EXISTING=$(gh issue list --search "CI health degraded" --state open --json number --jq 'length' 2>/dev/null || echo 0)
            EXISTING=${EXISTING:-0}

            if [ "$EXISTING" -eq 0 ]; then
              # Do NOT swallow errors: capture stderr (2>&1) so a real failure is
              # visible in the log and reported via ::error::, not hidden behind a
              # misleading "no permissions" message.
              ISSUE_URL=$(gh issue create \
                --title "CI health degraded — $FAILED of last 5 runs failed" \
                --label "bug,monitoring" \
                --body "Automated monitoring detected CI health degradation. Investigate recent workflow failures." 2>&1)
              RC=$?
              if [ $RC -ne 0 ]; then
                echo "::error::Failed to create CI health alert issue: $ISSUE_URL"
                exit 1
              fi
              echo "Created alert issue: $ISSUE_URL"
            else
              echo "Open CI health alert issue already exists ($EXISTING); skipping duplicate creation"
            fi

            # Degraded health is the alert condition — fail loudly so the scheduled
            # run shows red in Actions (intentional; the dedup guard above prevents
            # issue spam).
            exit 1
          fi

          echo "[OK] CI health acceptable ($FAILED recent failures)"

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Autonomous cycle monitoring ────────────────────────────────────
  cycle-check:
    name: Autonomous Cycle Health
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.check_type == 'all' || github.event.inputs.check_type == 'cycles' || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check autonomous cycle status
        run: |
          echo "Checking autonomous cycle health..."

          # Get last 4 cycle runs (should be one every 6 hours)
          CYCLES=$(gh run list --workflow=autonomous.yml --limit=4 --json conclusion,updatedAt,databaseId 2>/dev/null || true)
          CYCLES=${CYCLES:-[]}

          # Pipe the run data into the parser: without this, sys.stdin.read() below
          # sees empty input and the check always reports "no runs found".
          echo "$CYCLES" | python -c "
          import sys, json
          from datetime import datetime, timezone

          data = sys.stdin.read().strip()
          runs = json.loads(data) if data else []
          if not runs:
              print('[WARN] No autonomous cycle runs found')
              sys.exit(0)

          failed = [r for r in runs if r.get('conclusion') == 'failure']
          total = len(runs)

          print(f'Last {total} cycles: {total - len(failed)} succeeded, {len(failed)} failed')

          if len(failed) >= 2:
              print(f'::error::{len(failed)} of last {total} autonomous cycles failed')
              sys.exit(1)
          elif len(failed) == 1:
              print(f'::warning::1 of last {total} autonomous cycles failed — monitor')
          else:
              print('[OK] All recent cycles succeeded')
          "

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Metrics anomaly detection ──────────────────────────────────────
  metrics-check:
    defaults:
      run:
        working-directory: ai-company
    name: Metrics Anomaly Check
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.check_type == 'all' || github.event.inputs.check_type == 'metrics' || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analyze metrics
        run: |
          python -c "
          import json
          from pathlib import Path

          inbox = Path('.opencode/inbox.json')
          if not inbox.exists():
              print('[OK] No inbox data to analyze')
              exit(0)

          tasks = json.loads(inbox.read_text())

          total = len(tasks)
          if total == 0:
              print('[OK] No tasks in queue')
              exit(0)

          by_status = {}
          for t in tasks:
              s = t.get('status', 'unknown')
              by_status[s] = by_status.get(s, 0) + 1

          failed = by_status.get('failed', 0)
          escalated = by_status.get('escalated', 0)
          pending = by_status.get('pending', 0)

          print(f'Task summary: {total} total, {pending} pending, {failed} failed, {escalated} escalated')

          # Alert conditions
          issues = []
          if total > 0 and failed / total > 0.2:
              issues.append(f'High failure rate: {failed}/{total} ({failed/total*100:.0f}%)')
          if escalated > 5:
              issues.append(f'High escalation count: {escalated}')
          if pending > 50:
              issues.append(f'Large pending queue: {pending}')

          if issues:
              for issue in issues:
                  print(f'::warning::{issue}')
          else:
              print('[OK] Metrics within normal range')
          "

  # ── Dependency vulnerability check ─────────────────────────────────
  dep-check:
    name: Dependency Health
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.check_type == 'all' || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Check for vulnerable dependencies
        working-directory: ai-company
        run: |
          if uv audit --frozen > audit-report.txt 2>&1; then
            echo "[OK] No known vulnerabilities found"
          else
            echo "::warning::Found dependencies with known vulnerabilities — see audit-report.txt"
            cat audit-report.txt
          fi
