name: Auto-merge Dependabot PRs

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, opened, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Check if PR is labeled for auto-merge
        id: check-label
        run: |
          LABELS=$(echo '${{ toJson(github.event.pull_request.labels) }}' | jq -r '.[].name')
          if echo "$LABELS" | grep -q "auto-merge"; then
            echo "auto_merge=true" >> $GITHUB_OUTPUT
          else
            echo "auto_merge=false" >> $GITHUB_OUTPUT
          fi

      - name: Enable auto-merge
        if: steps.check-label.outputs.auto_merge == 'true'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          merge-method: squash

      - name: Add auto-merge label when all checks pass
        if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'dependencies'
        run: |
          # Check if all required status checks are passing
          # This is a simplified check - in production you'd want to use the checks API
          echo "PR labeled with dependencies, monitoring for auto-merge eligibility"

      - name: Approve and merge when CI passes
        if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
        run: |
          # Only for dependabot PRs with all checks passing
          echo "Review approved, checking if we can auto-merge"