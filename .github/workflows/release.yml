name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.4.0)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write  # Required for trusted publishing to PyPI

jobs:
  # D3: Semver validation - verify git tag matches pyproject.toml version
  version-check:
    name: Validate Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from pyproject.toml
        id: pyproject_version
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get version from git tag
        id: tag_version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG_VERSION="${{ github.event.inputs.version }}"
          else
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT

      - name: Compare versions
        run: |
          PY_VERSION="${{ steps.pyproject_version.outputs.version }}"
          TAG_VERSION="${{ steps.tag_version.outputs.version }}"
          echo "pyproject.toml version: $PY_VERSION"
          echo "git tag version: $TAG_VERSION"
          if [[ "$PY_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Version mismatch: pyproject.toml ($PY_VERSION) != git tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Verify CHANGELOG has entry for version
        run: |
          VERSION="${{ steps.pyproject_version.outputs.version }}"
          if ! grep -q "## \[$VERSION\]" .ai-company/state/CHANGELOG.md; then
            echo "::error::CHANGELOG.md missing entry for version $VERSION"
            exit 1
          fi

  # Build the package
  build:
    name: Build Package
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 30

  # D1: PyPI publishing with trusted publishing (OIDC)
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

  # D2: Docker build and push to GHCR
  docker:
    name: Build and Push Docker Image
    needs: version-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Required for pushing to GHCR
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Create GitHub Release (attaches dist artifacts)
  github-release:
    name: Create GitHub Release
    needs: [publish-pypi, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
