name: Site Build + Principles Gate

# Binding gate for the client-facing website (Guiding Principles, CMO mandate v1.0).
# PR trigger has NO path filter so the required check always reports (ruleset
# "main zero-red gate" requires this context on every PR to main).
# Non-site PRs still get a fast green run (build is ~15s).
# Enforces the automatable subset of Appendix A checks:
#   check 6 — zero TypeScript/build errors (bun run build = tsc + vite) and
#             no fake-success form states (scripts/test/check-site-form-backend.py).
#   deploy guard — .vercelignore must keep vite alias targets and build inputs
#             uploadable (scripts/test/check-vercelignore.py; CI builds the full
#             checkout while Vercel builds the filtered upload, so this check
#             cannot be folded into the build step).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "vercel.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "bun.lock"
      - "data/**"
      - ".vercelignore"
      - "scripts/test/check-vercelignore.py"
      - ".github/workflows/site-principles-gate.yml"
  workflow_dispatch:

concurrency:
  group: site-principles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-gate:
    name: Site Build + Principles Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify .vercelignore keeps site build inputs — deploy guard
        run: python3 scripts/test/check-vercelignore.py

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Require bun.lock — fail-early lockfile guard
        run: |
          if [ ! -f bun.lock ]; then
            echo "::error::bun.lock is missing — generate with 'bun install --lockfile-only' and commit it"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site (tsc + vite) + unit tests — Appendix A check 6
        run: bun run site:check

      - name: Reject fake-success forms — Appendix A check 6 (§10)
        run: python3 scripts/test/check-site-form-backend.py
