name: Daily Audit Export

# Decision D-a: CI is a freshness GUARD only.  The canonical trail
# (.opencode/audit) is gitignored, so CI can never export it; the local runner
# scripts/export-audit-evidence.ps1 (Task Scheduler) appends to
# reports/evidence/audit-export-runs.jsonl and commits the dated evidence.
# This workflow fails when the runner has not run within 36h or its evidence
# is missing.  workflow_dispatch re-runs the guard (no inputs).

on:
  schedule:
    # Daily at 07:00 UTC (after the weekly repo-audit at 06:00 UTC)
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  export-audit:
    name: Guard Audit Export Freshness
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check export freshness
        id: guard
        run: |
          RUN_LOG="reports/evidence/audit-export-runs.jsonl"
          if [ ! -s "$RUN_LOG" ]; then
            echo "::error::Run log missing or empty - local exporter (scripts/export-audit-evidence.ps1) has never run"
            exit 1
          fi
          LAST="$(tail -n 1 "$RUN_LOG")"
          RUN_DATE="$(jq -r '.date' <<<"$LAST")"
          EVENTS="$(jq -r '.events' <<<"$LAST")"
          RUN_AT="$(jq -r '.run_at' <<<"$LAST")"
          if [ -z "$RUN_DATE" ] || [ "$RUN_DATE" = "null" ] || [ -z "$RUN_AT" ] || [ "$RUN_AT" = "null" ]; then
            echo "::error::Malformed run-log line: $LAST"
            exit 1
          fi
          echo "date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "events=$EVENTS" >> "$GITHUB_OUTPUT"
          AGE="$(( $(date -u +%s) - $(date -u -d "$RUN_AT" +%s) ))"
          if [ "$AGE" -gt 129600 ]; then
            echo "::error::Last export run was $(( AGE / 3600 ))h ago ($RUN_AT) - stale; run scripts/export-audit-evidence.ps1"
            exit 1
          fi
          if [ "$EVENTS" -gt 0 ]; then
            FILE="reports/evidence/audit-$RUN_DATE.jsonl"
            if [ ! -s "$FILE" ]; then
              echo "::error::Expected evidence file missing or empty: $FILE (events=$EVENTS)"
              exit 1
            fi
          fi
          echo "Freshness OK: $EVENTS events for $RUN_DATE (age ${AGE}s)"

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-evidence
          path: reports/evidence/*-${{ steps.guard.outputs.date }}.jsonl
          if-no-files-found: warn
          retention-days: 90

      - name: Commit evidence
        if: always()
        env:
          REPO_AUDIT_DEPLOY_KEY: ${{ secrets.REPO_AUDIT_DEPLOY_KEY }}
        run: |
          export AUDIT_DATE="${{ steps.guard.outputs.date }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          FILES=(reports/evidence/*"${AUDIT_DATE}".jsonl)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No evidence files present for ${AUDIT_DATE}."
          else
            git add "${FILES[@]}"
            if git diff --cached --quiet; then
              echo "No new audit evidence to commit."
            else
              git commit -m "audit: daily evidence export ${AUDIT_DATE}"
              # Push via the repo-audit write deploy key so the main ruleset
              # bypass actor (DeployKey) applies; GITHUB_TOKEN cannot bypass.
              mkdir -p ~/.ssh
              umask 177
              printf '%s\n' "$REPO_AUDIT_DEPLOY_KEY" > ~/.ssh/repo-audit_deploy
              ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
              git config core.sshCommand \
                "ssh -i ~/.ssh/repo-audit_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"
              git remote set-url origin "git@github.com:jmlusu/light-speed-holdings.git"
              git push -u origin "HEAD:refs/heads/$GITHUB_REF_NAME" || {
                git pull --rebase --autostash
                git push -u origin "HEAD:refs/heads/$GITHUB_REF_NAME"
              }
            fi
          fi
