name: CI

# Authoritative merge gate. All jobs must pass before a PR can merge to main.
# Local pre-commit hooks can be bypassed with --no-verify, so this
# server-side gate is the enforced source of truth for ruff + mypy + pytest.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: ai-company

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --frozen
      - name: Ruff lint
        run: uv run ruff check src/ tests/

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --frozen
      - name: Mypy
        run: uv run mypy src/

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --frozen
      # coverage gate (TD-7): fail if src/ai_company coverage drops below 72%.
      # CLI entry points are excluded via [tool.coverage.run].omit in pyproject.toml.
      - name: Pytest with coverage gate
        run: uv run pytest -q --cov=src/ai_company --cov-report=term-missing --cov-fail-under=72

  harness:
    name: ECL Harness Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pwsh -NoProfile -File scripts/lint-ecl.ps1

  security:
    name: Security (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --frozen
      - name: Bandit
        run: uv run bandit -r src/ -c pyproject.toml

  dependencies:
    name: Dependency Audit (uv-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: uv-audit
        # uv-audit is not a project dependency, so invoke it via uvx against uv.lock.
        run: uvx uv-audit

  generated-check:
    name: Generated Files Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --frozen
      - name: Regenerate agents from registry
        run: uv run python -c "from ai_company.generator import AgentGenerator; AgentGenerator().generate_all()"
      - name: Verify no drift
        run: |
          git diff --exit-code || { echo "::error::Generated agent files drifted from the committed state. Run 'uv run python -c \"from ai_company.generator import AgentGenerator; AgentGenerator().generate_all()\"' and commit the regenerated output."; exit 1; }
          echo "Generated agents are in sync with the registry."

  # All required checks must succeed for the gate to pass.
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, harness, security, dependencies, generated-check]
    steps:
      - uses: actions/checkout@v5
      - run: echo "All required checks passed (ruff + mypy + pytest + coverage + harness + bandit + uv-audit + generated-files)."
