name: site

# Marketing site (Next.js) — build + lint gate.
# Deployment happens via Vercel's Git integration; this job only validates
# that the site builds cleanly on pushes/PRs that touch it.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/site.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Verify artifacts
        run: |
          test -d .next || (echo "missing .next" && exit 1)
          echo "Artifacts OK"
          ls -lh .next | head -20
