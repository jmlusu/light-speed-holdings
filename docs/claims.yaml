# Layout / spec constants that are not factual claims. Every entry needs a reason a reviewer can check.
structural:
  - display: "90-day"
    reason: "Roadmap horizon label on slide 10; not a measurable KPI."
    slides: [10]
  - display: "6-MONTH"
    reason: "Roadmap horizon label on slide 10; not a measurable KPI."
    slides: [10]
  - display: "1-YEAR"
    reason: "Roadmap horizon label on slide 10; not a measurable KPI."
    slides: [10]
  - display: "5-tier"
    reason: "Approval matrix tier count defined in architecture docs."
    slides: [4, 8, 9, 10]
  - display: "5-tier approval matrix"
    reason: "Approval matrix tier count defined in architecture docs."
    slides: [4, 8, 9, 10]
  - display: "canonical 7 tools"
    reason: "Tool vocabulary defined in AGENTS.md §8."
    slides: [8]
  - display: "SOC 2"
    reason: "Security compliance standard name referenced on slide 11."
    slides: [11]
  - display: "GDPR"
    reason: "Data protection regulation name referenced on slide 11."
    slides: [11]

forbidden_patterns:
  - pattern: "Fortune\\s*\\d+"
    reason: "Client-tier claims need a verified, publishable reference first."
  - pattern: "\\btestimonial\\b"
    reason: "No testimonials without written consent on file."

