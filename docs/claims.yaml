      path: src/data/generated/agent-registry.public.json
      quote: '"departments": 20'
    notes: "Generated from company-registry.yaml; regenerated and drift-checked in CI."

  # --- the misattribution seen in the session ------------------------------------------------
  # AGENTS.md says company-registry.yaml holds the ATC / velocity / capital-efficiency KPIs, but the
  # registry text the agent read contained no such figures. Find the REAL source or delete the claim.
  - id: atc-rate
    display: ["ATC >90%"]
    statement: "Agent task completion rate across pilot workflows."
    type: percentage
    status: retracted
    notes: "D-06: no denominator exists (empty database, zero terminal task events). Target only."

  # --- template-script inherited figures (not backed by spec or registry) --------------------
  - id: tam-65b
