# docs/claims.yaml - the ONLY place a number may come from.
# Rule: if a figure is on a slide (or in speaker notes) it must match a `display` string below
# AND that claim must be status: verified with a source verify-deck.py can check.
#
# Seeded from the figures found in the first generated deck. Everything starts UNVERIFIED so the
# gate fails until a human decides each one is real. Copy display strings from:
#     markitdown deck.pptx
schema_version: 1

claims:
  # --- derived from a script run: needs a human to confirm before it can be used --------------
  - id: agents-total
    display: ["90 agents"]
    statement: "Number of agents defined in company-registry.yaml."
    type: count
    status: verified
    verified_on: 2026-10-26
    verified_by: ci:deck-claims
    source:
      kind: file
      path: src/data/generated/agent-registry.public.json
      quote: '"agents": 90'
    notes: "Generated from company-registry.yaml; regenerated and drift-checked in CI."

  - id: agents-ai-89
    display: ["89 AI agents"]
    statement: "AI agents in the registry: 90 operating roles less the one Human CEO."
    type: count
    status: verified
    verified_on: 2026-10-26
    verified_by: ci:deck-claims
    source:
      kind: file
      path: src/data/generated/agent-registry.public.json
      quote: '"agents": 90'
    derivation: "The registry has 90 entries; the one Human CEO entry (company-registry.yaml id human_ceo, emitted as human-ceo) is the human, leaving 89 AI agents."
    notes: "Matches the canonical public count guard in src/__tests__/claims.test.ts."

  - id: departments-total
