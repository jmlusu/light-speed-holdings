# docs/claims.yaml - the ONLY place a number may come from.
# Rule: if a figure is on a slide (or in speaker notes) it must match a `display` string below
# AND that claim must be status: verified with a source verify-deck.py can check.
#
# Seeded from the figures found in the first generated deck. Everything starts UNVERIFIED so the
# gate fails until a human decides each one is real. Copy display strings from:
#     markitdown deck.pptx
schema_version: 1

claims:
  # --- derived from a script run: needs a human to confirm before it can be used --------------
  - id: agents-total
    display: ["90 agents"]
    statement: "Number of agents defined in company-registry.yaml."
    type: count
    status: unverified          # promote to verified once confirmed (see template at bottom)
    source:
      kind: command
      command: "python scripts/maintenance/company_counts.py"
      recorded_output: "agents: 90"
      recorded_on: "2026-10-23"
    notes: "Recorded from the generation session; not re-run by the gate. A human must confirm."

  - id: departments-total
    display: ["20 departments"]
    statement: "Number of departments defined in company-registry.yaml."
    type: count
    status: unverified
    source:
      kind: command
      command: "python scripts/maintenance/company_counts.py"
      recorded_output: "departments: 20"
      recorded_on: "2026-10-23"
    notes: "Recorded from the generation session; not re-run by the gate. A human must confirm."

  # --- the misattribution seen in the session ------------------------------------------------
  # AGENTS.md says company-registry.yaml holds the ATC / velocity / capital-efficiency KPIs, but the
  # registry text the agent read contained no such figures. Find the REAL source or delete the claim.
  - id: atc-rate
    display: ["ATC >90%"]
    statement: "Agent task completion rate across pilot workflows."
    type: percentage
    status: unverified
    notes: "No source located. Do not show on slides until a source file + exact quote exist."

