# docs/source-of-truth.yaml
# Maps factual claims in documentation to their authoritative source files.
# Used by scripts/validate-drift.ps1 and tests/docs/test_doc_drift.py
#
# When a source file changes, the validation script reads this manifest,
# extracts the current value via the extractor, and verifies that all
# dependent docs still contain the expected pattern.
#
# Each claim has:
#   source         - canonical file path (relative to project root)
#   extractor      - how to get the current value (shell command or description)
#   pattern        - regex pattern that dependent docs should match
#   docs           - list of doc files that must contain the pattern
#   archived_exempt - if true, docs/archive/ and docs/adr/ are exempt from checks
#   anti_pattern   - optional: code pattern that should NOT appear in scope

claims:
  # ── Organizational counts ──────────────────────────────────────────────
  department_count:
    source: company-registry.yaml
    extractor: "count unique department values under 'company.agents:' entries"
    # Canonical: 20 departments (registry is source of truth).
    # company/departments.yaml has 19 (missing pharos) — must be reconciled.
    # docs/STATUS.md is excluded: it is a dated milestone log whose historical
    # entries (e.g. "19 departments") must not be retro-validated.
    current_value: 20
    pattern: "\\d+ departments?"
    docs:
      - README.md
      - docs/USER-GUIDE.md
      - docs/API-REFERENCE.md
      - docs/ORGANIZATION.md
    archived_exempt: true

  agent_count:
    source: company-registry.yaml
    extractor: "count 'id:' entries under 'company.agents:'"
    # Canonical: 144 agents (143 AI + 1 human CEO)
    # docs/STATUS.md is excluded: its dated changelog entries reference earlier
    # roster sizes (127/135/...), which would false-positive the blanket pattern.
    current_value: 144
    pattern: "\\d+ agents?"
    docs:
      - README.md
      - docs/USER-GUIDE.md
      - docs/ORGANIZATION.md
    archived_exempt: true

  kpi_count:
    source: company/config/kpis.yaml
    extractor: "count KPI entries across all departments"
    # Canonical: 25 KPIs across 8 departments
    # docs/STATUS.md excluded (historical milestone log).
    current_value: 25
    pattern: "\\d+ KPIs\\b"
    docs:
      - README.md
      - docs/USER-GUIDE.md
    archived_exempt: true

  kpi_department_count:
    source: company/config/kpis.yaml
    extractor: "count department keys under 'departments:'"
    # Canonical: 8 departments have KPI definitions. Pattern requires the digit
    # directly before "KPI-enabled departments" so it cannot collide with the
    # department_count claim (which demands any bare "N departments" be 20).
    current_value: 8
    pattern: "\\d+ KPI-enabled departments?"
    docs:
      - README.md
      - docs/USER-GUIDE.md
    archived_exempt: true

  template_count:
    source: templates/
    extractor: "find templates/ -name '*.j2' | wc -l"
    # Canonical: 9 Jinja2 templates. The pattern anchors the count to
    # "Jinja2 templates" to avoid matching the "2 templates" substring inside
    # the word "Jinja2 templates" (which broke the loose `\d+ templates?` form).
    current_value: 9
    pattern: "\\d+ Jinja2 templates?"
    docs:
      - README.md
      - docs/ux/DEVELOPER-EXPERIENCE.md
    archived_exempt: true

  provider_count:
    source: company/models.yaml
    extractor: "count provider entries"
    # Canonical: 9 LLM providers
    current_value: 9
    pattern: "\\d+ providers?"
    docs:
      - README.md
      - docs/ux/DEVELOPER-EXPERIENCE.md
    archived_exempt: true

  # ── Code patterns ──────────────────────────────────────────────────────
  path_resolution_pattern:
    source: src/ai_company/paths.py
    extractor: "canonical function name: get_project_root()"
    anti_pattern:
      regex: "Path\\(__file__\\)\\.parent\\.parent(?!\\.parent)"
      scope: "src/ai_company/cli/*.py"
      message: "Use get_project_root() from ai_company.paths instead of Path(__file__).parent.parent"
    docs: []
    archived_exempt: false

  kpi_config_location:
    source: company/config/kpis.yaml
    extractor: "file must exist at company/config/kpis.yaml"
    anti_pattern:
      regex: "Path\\(__file__\\)\\.parent\\.parent\\.parent.*[\"']company"
      scope: "src/ai_company/cli/*.py"
      message: "Resolve KPI config via get_project_root() / 'company/config/kpis.yaml' instead of relative path traversal"
    docs: []
    archived_exempt: false

  # ── Runtime requirements ───────────────────────────────────────────────
  python_version:
    source: pyproject.toml
    extractor: "read requires-python field"
    # Canonical: >=3.12
    current_value: ">=3.12"
    pattern: "Python \\d+\\.\\d+"
    docs:
      - README.md
      - docs/DEVELOPMENT.md
    archived_exempt: true

  # ── Dynamic claims (computed, not static) ──────────────────────────────
  test_count:
    source: dynamic
    extractor: "pytest --collect-only -q | tail -1"
    # Dynamically computed at validation time.
    pattern: null
    docs: []
    archived_exempt: false
