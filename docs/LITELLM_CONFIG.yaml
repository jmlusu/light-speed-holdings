# LiteLLM Proxy Configuration for LightSpeed Remote Autonomous Runtime
# Deploy on Render (always-on) or Cloudflare Worker
# Zero-card providers only: Gemini (AI Studio) + Cloudflare Workers AI + Groq + OpenRouter

model_list:
  # ─────────────────────────────────────────────────────────────────
  # TIER 1: Complex reasoning, long context (premium tasks)
  # ─────────────────────────────────────────────────────────────────
  - model_name: "gemini-flash"
    litellm_params:
      model: "gemini/gemini-2.5-flash"
      api_key: "os.environ/GEMINI_API_KEY"
      # Optional: custom endpoint for AI Studio
      # api_base: "https://generativelanguage.googleapis.com/v1beta/openai"
    model_info:
      max_tokens: 1048576
      max_input_tokens: 1048576
      max_output_tokens: 8192
      supports_function_calling: true
      supports_vision: true
      supports_json_mode: true
      supports_streaming: true
      mode: "chat"
    tpm: 1000000
    rpm: 1500
    priority: 1
    tags: ["premium", "reasoning", "long-context", "google"]

  - model_name: "gemini-flash-lite"
