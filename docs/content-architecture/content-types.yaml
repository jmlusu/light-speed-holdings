# LightSpeed Content Architecture Content Types

# Core content types
- key: page
  name: Page
  description: "A website page (landing, about, service, etc.)"
  category: core
  parent_content_type: null
  variables:
    - key: "{PAGE_TITLE}"
      type: string
      required: true
    - key: "{PAGE_SLUG}"
      type: string
      required: true

- key: service
  name: Service
  description: "A service offering provided by LightSpeed"
  category: core
  parent_content_type: null
  variables:
    - key: "{SERVICE_TITLE}"
      type: string
      required: true
    - key: "{SERVICE_KEY}"
      type: string
      required: true

- key: capability
