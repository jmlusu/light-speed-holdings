## Traversal Direction
- forward: client_profile → industry → problem → use_case → capability → service → engagement_model → outcome
- reverse: outcome → engagement_model → service → capability → use_case → problem → industry → client_profile

## Reserved Variable Names (never add to variable lists)
- FIRST_NAME
- LAST_NAME
- EMAIL
- RESEND_UNSUBSCRIBE_URL

These are automatically available in Resend and will cause validation errors if included in content type variable definitions.