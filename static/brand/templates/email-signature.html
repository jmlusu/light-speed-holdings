<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LightSpeed Holdings — Email Signature</title>
<style>
  body { margin: 0; padding: 20px; font-family: Arial, Helvetica, sans-serif; background: #ffffff; }
  .signature { width: 600px; background: #F2F2F2; border: 1px solid #e5e5e5; padding: 0; font-family: Arial, Helvetica, sans-serif; }
  .signature-header { padding: 24px 30px 16px; text-align: center; }
  .signature-logo { height: 60px; width: auto; }
  .company-name { font-size: 18px; font-weight: 700; color: #070A40; letter-spacing: 2px; margin: 8px 0 4px; text-transform: uppercase; }
  .tagline { font-size: 12px; color: #070A40; opacity: 0.65; letter-spacing: 1px; }
  .divider { height: 3px; background: #070A40; margin: 0; }
  .signature-body { padding: 20px 30px; }
  .person-name { font-size: 16px; font-weight: 700; color: #070A40; margin: 0 0 2px; }
  .person-title { font-size: 13px; color: #070A40; opacity: 0.7; margin: 0 0 12px; }
  .contact-row { font-size: 12px; color: #070A40; margin: 4px 0; }
  .contact-row a { color: #070A40; text-decoration: none; }
  .contact-label { font-weight: 600; }
</style>
</head>
<body>
<table class="signature" cellpadding="0" cellspacing="0" border="0" style="width:600px;background:#F2F2F2;font-family:Arial,Helvetica,sans-serif;">
  <!-- Header with Logo -->
  <tr>
    <td style="padding:24px 30px 16px;text-align:center;">
      <img src="https://lightspeedholdings.com/brand/logos/icononly/icononly.png" alt="LightSpeed Holdings" style="height:60px;width:auto;" />
      <div style="font-size:18px;font-weight:700;color:#070A40;letter-spacing:2px;margin:8px 0 4px;text-transform:uppercase;">LIGHTSPEED HOLDINGS LIMITED</div>
      <div style="font-size:12px;color:#070A40;opacity:0.65;letter-spacing:1px;">Aspire. Act. Achieve.</div>
    </td>
  </tr>
  <!-- Navy Divider -->
  <tr>
    <td style="padding:0;"><div style="height:3px;background:#070A40;"></div></td>
  </tr>
  <!-- Contact Info -->
  <tr>
    <td style="padding:20px 30px;">
      <div style="font-size:16px;font-weight:700;color:#070A40;margin:0 0 2px;">[Your Name]</div>
      <div style="font-size:13px;color:#070A40;opacity:0.7;margin:0 0 12px;">[Your Title]</div>
      <table cellpadding="0" cellspacing="0" border="0" style="font-size:12px;color:#070A40;">
        <tr>
          <td style="padding:3px 0;"><span style="font-weight:600;">Email:</span>&nbsp;</td>
          <td style="padding:3px 0;"><a href="mailto:[email]" style="color:#070A40;text-decoration:none;">[email]</a></td>
        </tr>
        <tr>
          <td style="padding:3px 0;"><span style="font-weight:600;">Phone:</span>&nbsp;</td>
          <td style="padding:3px 0;">[phone]</td>
        </tr>
        <tr>
          <td style="padding:3px 0;"><span style="font-weight:600;">Web:</span>&nbsp;</td>
          <td style="padding:3px 0;"><a href="https://lightspeedholdings.com" style="color:#070A40;text-decoration:none;">lightspeedholdings.com</a></td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
