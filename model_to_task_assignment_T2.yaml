model_to_task_assignment_T2:
  # Creative Production Stack Specialties
  - specialty: ls-creative-director
    model_tier: premium
    expected_speed: slow
    expected_quality: high
    expected_cost: high
    rationale: Orchestrates the full creative stack; requires maximum reasoning for brief intake, skill routing, and critical decision-making. Premium tier ensures best-quality outputs for high-stakes artifacts.

  - specialty: ls-frontend-design
    model_tier: standard
    expected_speed: medium
    expected_quality: medium
    expected_cost: medium
    rationale: Builds on-brand websites and landing pages using the repo's Vite React SPA. Standard tier provides balanced capability for UI implementation, responsive design, and the "no AI slop" checklist.

  - specialty: ls-presentation-design
    model_tier: standard
    expected_speed: medium
    expected_quality: medium
    expected_cost: medium
    rationale: Generates board presentations, investor decks, and keynotes. Standard tier is sufficient for chart creation, speaker notes, and branded layout rendering via python-pptx.

  - specialty: ls-document-design
    model_tier: standard
    expected_speed: medium
    expected_quality: medium
    expected_cost: medium
    rationale: Produces whitepapers, strategy reports, and policy papers. Standard tier handles typography, chart generation, and document architecture reliably.

  - specialty: ls-social-media-design
    model_tier: standard
    expected_speed: medium
    expected_quality: medium
    expected_cost: medium
    rationale: Creates multi-channel campaigns (LinkedIn, X, Instagram, Facebook). Standard tier balances cost with the need for platform-specific dimensions and on-brand visuals.

  - specialty: ls-brand-advertising
    model_tier: standard
    expected_speed: medium
    expected_quality: medium
    expected_cost: medium
    rationale: Generates digital ads, display ads, billboards, and promotional graphics. Standard tier suffices for ad dimension enforcement and brand palette adherence.

  - specialty: ls-diagramming
    model_tier: standard
    expected_speed: medium
    expected_quality: medium
    expected_cost: medium
    rationale: Creates architecture, process, and strategy diagrams (Mermaid, SVG, Kroki). Standard tier handles the full diagram type palette with brand-palette restyling.

  - specialty: ls-visual-storytelling
    model_tier: standard
    expected_speed: medium
    expected_quality: medium
    expected_cost: medium
    rationale: Turns information into infographics, timelines, and visual abstracts. Standard tier supports Nano Banana Pro refinement and Gemini quality review.

  - specialty: ls-documentation-engineering
    model_tier: standard
    expected_speed: medium
    expected_quality: medium
    expected_cost: medium
    rationale: Builds READMEs, API docs, developer portals, and knowledge bases. Standard tier handles Diátaxis-classified content (tutorial, how-to, reference) consistently.

