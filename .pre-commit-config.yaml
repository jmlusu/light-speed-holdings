repos:
  # ── General file hygiene ───────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: '^(brand|static/brand)/print/.*\.svg$|\.opencode/skills/archify/assets/template\.html$|\.opencode/skills/archify/examples/.*\.json$'
      - id: detect-private-key
        # full-repo-audit-2026-05-23.md quotes standard AWS example keys and an
        # ellipsis placeholder inside a security-scan writeup; the key block is
        # explicitly documented as non-live example material (see issue #72).
        exclude: ^\.agents/skills/docs/maintainers/full-repo-audit-2026-05-23\.md$

  # ── Ruff: lint + format ────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  # ── Mypy: type checking ───────────────────────────────────────────
  # Hooks run from the repo root, targeting the root config and sources.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-PyYAML
          - pydantic>=2.8
          - typer
          - rich
          - fastapi
          - cryptography>=42.0
          - httpx
        pass_filenames: false
        entry: mypy --config-file pyproject.toml src/
        stages: [pre-commit]

  # ── Bandit: security linting ───────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        pass_filenames: false
        entry: bandit -c pyproject.toml -r src/
        additional_dependencies: ["bandit[toml]"]
        stages: [pre-commit]

  # ── Graphify: keep the knowledge graph fresh after every commit ────
  - repo: local
    hooks:
      - id: graphify-rebuild
        name: rebuild-graphify-graph
        entry: uv run graphify update .
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-commit]

  # ── Documentation drift validation ─────────────────────────────────
  - repo: local
    hooks:
      - id: validate-drift
        name: validate-doc-drift
        entry: pwsh -File scripts/validate-drift.ps1
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
