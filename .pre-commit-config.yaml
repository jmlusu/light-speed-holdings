repos:
  # ── General file hygiene ───────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: '^(brand|static/brand|public/brand)/(print|dist|logos|digital)/.*\.(svg|png|jpe?g)$|^docs/diagrams/.*\.(png|jpe?g)$|\.opencode/skills/archify/assets/template\.html$|\.opencode/skills/archify/examples/.*\.json$'
      - id: detect-private-key
        # full-repo-audit-2026-05-23.md quotes standard AWS example keys and an
        # ellipsis placeholder inside a security-scan writeup; the key block is
        # explicitly documented as non-live example material (see issue #72).
        # (LS-MEM redaction exclusions removed with the 2026-10-07 decommission.)
        exclude: ^(\.agents/skills/docs/maintainers/full-repo-audit-2026-05-23\.md)$

  # ── Ruff: lint + format ────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  # ── Mypy: type checking ───────────────────────────────────────────
  # Hooks run from the repo root, targeting the root config and sources.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-PyYAML
          - pydantic>=2.8
          - typer
          - rich
          - fastapi
          - cryptography>=42.0
          - httpx2
        pass_filenames: false
        entry: mypy --config-file pyproject.toml src/
        stages: [pre-commit]

  # ── Bandit: security linting ───────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        pass_filenames: false
        entry: bandit -c pyproject.toml -r src/
        additional_dependencies: ["bandit[toml]"]
        stages: [pre-commit]

  # ── Capture bug-fix records for organizational memory ────
  - repo: local
    hooks:
      - id: capture-fix
        name: capture bug-fix record
        entry: pwsh -File scripts/maintenance/capture-fix.ps1
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-commit]

  # PowerShell anti-pattern scan
  # FAIL: backtick-before-dollar (BUG-d75423bb7); WARN: unsorted Get-ChildItem (BUG-93e21736a)
  - repo: local
    hooks:
      - id: ps-antipattern
        name: powershell anti-pattern scan
        entry: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/maintenance/scan-ps-antipatterns.ps1
        language: system
        files: '\.ps1$'
        stages: [pre-commit]

  # Documentation drift validation ─────────────────────────────────
  - repo: local
    hooks:
      - id: validate-drift
        name: validate-doc-drift
        entry: pwsh -File scripts/maintenance/validate-drift.ps1
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # INDEX.json byte-freshness guard (retro finding 2026-10-12)
  # Reindexes under Windows PowerShell 5.1 (canonical ConvertTo-Json dialect)
  # and fails if harness/changes/INDEX.json drifts from the regenerated bytes.
  # Windows-only by design: `powershell` (5.1) does not exist on POSIX hosts.
  - repo: local
    hooks:
      - id: index-freshness
        name: INDEX.json byte-freshness (powershell 5.1 reindex + diff)
        entry: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/maintenance/check-index-freshness.ps1
        language: system
        pass_filenames: false
        files: '^(harness/changes/|scripts/maintenance/(harness-change|check-index-freshness)\.ps1$)'
        stages: [pre-commit]

  # Generated-imagery register guard (ADR-027 section 6). Runs only when the
  # register, the generated directory, or the checker itself changes. The same
  # check runs in .github/workflows/ci.yml (job "Generated Imagery Register").
  - repo: local
    hooks:
      - id: generated-imagery
        name: generated imagery register check
        entry: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/maintenance/check-generated-imagery.ps1
        language: system
        pass_filenames: false
        files: '^(public/assets/generated/|scripts/maintenance/check-generated-imagery\.ps1$)'
        stages: [pre-commit]

  # Deploy guard: .vercelignore must keep vite alias targets uploadable ──
  # (Vercel filters the upload with .vercelignore; CI builds the full
  # checkout, so a whitelist regression only surfaces at deploy time.
  #  Same check runs in .github/workflows/site-principles-gate.yml.)
  - repo: local
    hooks:
      - id: vercelignore-guard
        name: verify .vercelignore keeps site build inputs
        entry: uv run python scripts/test/check-vercelignore.py
        language: system
        pass_filenames: false
        files: '^(\.vercelignore|vite\.config\.ts|scripts/test/check-vercelignore\.py|data/[^/]+/registry\.ts)$'
        stages: [pre-commit]
 # Ruff: lint templates
  # Catches logic errors in generator scripts (like the tuple-vs-string bug
  # that surfaced in generate-pitch-deck.py). Runs on every commit.
  - repo: local
    hooks:
      - id: ruff-templates
        name: ruff check on generator scripts
        entry: ruff check --fix --exit-non-zero-on-fix static/brand/templates/
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # CEO Override Governance Protocol for root config files (AGENTS.md, opencode.json)
  # Blocks unauthorized automated changes; allows Human CEO overrides with audit trail.
  # See AGENTS.md §18 and docs/governance-audit.md for protocol details.
  # Runs at commit-msg stage to access the commit message file.
  - repo: local
    hooks:
      - id: validate-root-config
        name: validate CEO override for root config files
        entry: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/lint/validate-root-config.ps1
        language: system
        pass_filenames: false
        files: '^(AGENTS\.md|opencode\.json)$'
        stages: [commit-msg]
